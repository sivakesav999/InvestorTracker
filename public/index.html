<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Investment Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <div>
      <h1>Investment Tracker</h1>
      <!-- <p>Uncle's Business • Investor & Payment Management</p> -->
    </div>
    <div class="header-actions"><a class="btn light" href="/api/export">Export Excel</a><button class="btn light"
        onclick="logout()">Logout</button></div>
  </header>
  <main>
    <section class="cards" id="dashboard"></section>
    <section class="toolbar">
      <input id="search" placeholder="Search investor name, ID or phone...">
      <button class="btn" onclick="loadInvestors()">Search</button>
      <button class="btn primary" onclick="openNew()">+ Add Investor</button>
    </section>
    <section class="panel">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Investor</th>
              <th>Phone</th>
              <th>Investment</th>
              <th>Scheme</th>
              <th>Monthly</th>
              <th>Months Left</th>
              <th>Maturity</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="investors"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div class="modal" id="modal">
    <div class="modal-box">
      <div class="modal-head">
        <h2 id="modalTitle">Investor</h2><button onclick="closeModal()">×</button>
      </div>
      <form id="investorForm">
        <input type="hidden" id="id">
        <label>Name<input id="name" required></label><label>Phone<input id="phone"></label>
        <label>Address<textarea id="address"></textarea></label>
        <div class="grid"><label>Investment Date<input id="investment_date" type="date" required></label><label>Amount
            Invested<input id="amount" type="number" min="1" required></label></div>
        <label>Scheme<select id="scheme" required></select></label><label>Notes<textarea id="notes"></textarea></label>
        <div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button
            class="btn primary">Save Investor</button></div>
      </form>
    </div>
  </div>

  <div class="modal" id="paymentsModal">
    <div class="modal-box wide">
      <div class="modal-head">
        <h2 id="paymentTitle">Payments</h2><button onclick="closePayments()">×</button>
      </div>
      <div id="paymentSummary"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Month</th>
              <th>Due Date</th>
              <th>Due</th>
              <th>Paid</th>
              <th>Payment Date</th>
              <th>Method</th>
              <th>Notes</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="payments"></tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>

</html>
